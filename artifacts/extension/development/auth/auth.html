<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign in to Themys</title>
  <link rel="stylesheet" href="auth.css" />
</head>
<body>
  <div class="container">
    <div class="card">
      <div class="logo">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#17191c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
          <path d="M9 12l2 2 4-4"/>
        </svg>
      </div>
      <h1>Sign in to Themys</h1>
      <p class="subtitle">Connect your account to scan terms of service pages</p>
      <button id="sign-in-btn" class="btn-primary">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M15 3h4a2 2 0 012 2v14a2 2 0 01-2 2h-4"/>
          <polyline points="10 17 15 12 10 7"/>
          <line x1="15" y1="12" x2="3" y2="12"/>
        </svg>
        Sign in with Themys
      </button>
      <p class="hint">A new window will open for authentication</p>
      <div id="status" class="status hidden"></div>
      <p class="legal-links"><a href="https://docs.themys.ca/legal#privacy" target="_blank" rel="noopener">Privacy</a> · <a href="https://docs.themys.ca/legal#terms" target="_blank" rel="noopener">Terms</a></p>
    </div>
  </div>
  <script src="../config.js"></script>
  <script src="auth.js"></script>
</body>
</html>
