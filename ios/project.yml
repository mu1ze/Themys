name: Themys
options:
  bundleIdPrefix: ca.themys
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
packages:
  Clerk:
    url: https://github.com/clerk/clerk-ios
    from: "1.5.4"
targets:
  Themys:
    type: application
    platform: iOS
    sources:
      - path: Themys
      - path: Shared
    info:
      path: Themys/Info.plist
      properties:
        CFBundleDisplayName: Themys
        CFBundleURLTypes:
          - CFBundleURLName: ca.themys.app
            CFBundleURLSchemes:
              - themys
        CLERK_PUBLISHABLE_KEY: REPLACE_WITH_CLERK_PUBLISHABLE_KEY
        UILaunchScreen: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ca.themys.app
        INFOPLIST_FILE: Themys/Info.plist
        CODE_SIGN_ENTITLEMENTS: Themys/Themys.entitlements
        SWIFT_EMIT_LOC_STRINGS: YES
    dependencies:
      - target: ThemysSafariExtension
        embed: true
      - package: Clerk
        product: ClerkKit
      - package: Clerk
        product: ClerkKitUI
  ThemysSafariExtension:
    dependencies:
      - package: Clerk
        product: ClerkKit
    type: app-extension
    platform: iOS
    sources:
      - path: ThemysSafariExtension
        excludes:
          - "Resources/**"
      - path: Shared
    resources:
      - path: ThemysSafariExtension/Resources
        buildPhase: resources
    info:
      path: ThemysSafariExtension/Info.plist
      properties:
        CFBundleDisplayName: Themys
        NSExtension:
          NSExtensionPointIdentifier: com.apple.Safari.web-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).SafariWebExtensionHandler
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ca.themys.app.safari
        INFOPLIST_FILE: ThemysSafariExtension/Info.plist
        CODE_SIGN_ENTITLEMENTS: ThemysSafariExtension/ThemysSafariExtension.entitlements
        SKIP_INSTALL: YES
  ThemysMac:
    type: application
    platform: macOS
    sources:
      - path: ../macos/ThemysMac
    info:
      path: ../macos/ThemysMac/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ca.themys.mac
        INFOPLIST_FILE: ../macos/ThemysMac/Info.plist
    dependencies:
      - target: ThemysMacSafariExtension
        embed: true
  ThemysMacSafariExtension:
    type: app-extension
    platform: macOS
    sources:
      - path: ../macos/ThemysSafariExtension
        excludes:
          - "Resources/**"
    resources:
      - path: ../macos/ThemysSafariExtension/Resources
        buildPhase: resources
    info:
      path: ../macos/ThemysSafariExtension/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ca.themys.mac.safari
        INFOPLIST_FILE: ../macos/ThemysSafariExtension/Info.plist
        SKIP_INSTALL: YES
scheme:
  Themys:
    build:
      targets:
        Themys: all
        ThemysSafariExtension: all
  ThemysMac:
    build:
      targets:
        ThemysMac: all
        ThemysMacSafariExtension: all
