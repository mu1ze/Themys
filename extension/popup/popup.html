<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Themys</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="popup">
    <div class="header">
      <svg class="logo-icon" width="24" height="24" viewBox="0 0 24 24" fill="none">
        <path d="M12 2L19 5.5V13C19 17.5 15.5 21 12 22C8.5 21 5 17.5 5 13V5.5L12 2Z" fill="#17191c"/>
        <path d="M9 12l2 2 4-4" stroke="white" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span class="brand">Themys</span>
      <span class="spacer"></span>
      <button id="settings-btn" class="icon-btn" title="Settings">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8b8f98" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
        </svg>
      </button>
      <button id="sign-out-btn" class="btn-link hidden">Sign out</button>
    </div>

    <!-- Onboarding banner -->
    <div id="onboarding-banner" class="onboarding-banner hidden">
      <span>🚀 Complete setup to get started</span>
      <a href="#" id="onboarding-link" class="btn-link">Complete setup</a>
    </div>

    <!-- Auth section -->
    <div id="auth-section">
      <div id="not-signed-in" class="section">
        <p class="msg">Sign in to view your scan history</p>
        <button id="sign-in-btn" class="btn btn-primary">Sign in</button>
      </div>
    </div>

    <!-- Manual scan actions -->
    <div id="scan-actions" class="scan-actions">
      <button id="scan-page-btn" class="btn btn-secondary">Scan this page</button>
      <button id="scan-selection-btn" class="btn btn-secondary">Scan selection</button>
    </div>

    <!-- History section (shown after auth) -->
    <div id="history-section" class="hidden">
      <div class="section-header">
        <span class="section-label">Scan History</span>
        <button id="refresh-btn" class="icon-btn" title="Refresh">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 11-2.12-9.36L23 10"/></svg>
        </button>
      </div>

      <div id="history-loading" class="loading-state">
        <div class="spinner"></div>
        <span>Loading scans...</span>
      </div>

      <div id="history-empty" class="empty-state hidden">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" stroke-width="1.5"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
        <p>No scans yet</p>
        <a id="new-scan-link" href="#" target="_blank" class="btn-link">Start your first scan</a>
      </div>

      <div id="history-list" class="history-list hidden"></div>

      <div id="history-error" class="error-state hidden">
        <p id="history-error-msg"></p>
      </div>
    </div>

    <div class="footer">
      <a id="account-link" href="#">Account on the web</a>
      <span class="footer-sep">·</span>
      <a id="dashboard-link" href="#" target="_blank">Open dashboard</a>
    </div>
  </div>
  <script src="../config.js"></script>
  <script src="popup.js"></script>
</body>
</html>
